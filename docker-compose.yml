services:
  db:
    image: postgres:16-alpine
    container_name: locadora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locadora}
      POSTGRES_USER: ${POSTGRES_USER:-locadora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locadora123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - locadora_dados:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locadora} -d ${POSTGRES_DB:-locadora}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  locadora_dados:
